# Tells IndexNow-enabled search engines (Bing, Yandex, Seznam, Naver and the
# services that use Bing's index) which pages changed, right after GitHub
# Pages publishes them. Google does not use IndexNow; it reads sitemap.xml.
#
# The key below is public by design: IndexNow verifies it by fetching
# https://dotnetmadeeasy.com/66ce72676bb87456038ff2bd325f928b.txt from the site itself.
name: IndexNow

on:
  push:
    branches: [main]
    paths: ['**.html', 'sitemap.xml', 'llms.txt', 'feed.xml']
  workflow_dispatch:
    inputs:
      all:
        description: 'Submit every URL in sitemap.xml, not just changed pages'
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: indexnow
  cancel-in-progress: false

jobs:
  submit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      HOST: dotnetmadeeasy.com
      KEY: 66ce72676bb87456038ff2bd325f928b
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Work out which URLs to submit
        id: urls
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.all }}" = "true" ]; then
            grep -o '<loc>[^<]*</loc>' sitemap.xml | sed 's#<loc>##; s#</loc>##' > urls.txt
          else
            # Everything this push changed, even when it carries several commits.
            base="${{ github.event.before }}"
            if [ -z "$base" ] || ! git cat-file -e "$base^{commit}" 2>/dev/null; then base="HEAD^"; fi
            git diff --name-only "$base" HEAD -- '*.html' \
              | grep -v -E '^(404|app)\.html$|^google[0-9a-f]*\.html$|^src/' \
              | sed 's#^index\.html$##' \
              | sed "s#^#https://$HOST/#" > urls.txt || true
          fi
          sort -u urls.txt -o urls.txt
          echo "count=$(wc -l < urls.txt)" >> "$GITHUB_OUTPUT"
          head -20 urls.txt

      - name: Wait for GitHub Pages to publish this commit
        if: steps.urls.outputs.count != '0'
        run: |
          # Pages deploys from main a minute or two after the push. Wait until
          # the live sitemap matches this commit, so search engines fetch the
          # new pages rather than the old ones.
          want=$(sha256sum sitemap.xml | cut -d' ' -f1)
          for i in $(seq 1 30); do
            got=$(curl -fsSL "https://$HOST/sitemap.xml?nocache=$RANDOM" | sha256sum | cut -d' ' -f1 || true)
            key=$(curl -fsSL "https://$HOST/$KEY.txt" || true)
            if [ "$got" = "$want" ] && [ "$key" = "$KEY" ]; then echo "Live site is up to date."; exit 0; fi
            sleep 20
          done
          echo "Live site did not match after 10 minutes; submitting anyway."

      - name: Submit to IndexNow
        if: steps.urls.outputs.count != '0'
        run: |
          python3 - <<'PY'
          import json, os, time, urllib.error, urllib.request
          urls = [u.strip() for u in open('urls.txt') if u.strip()]
          host, key = os.environ['HOST'], os.environ['KEY']

          def submit(batch):
              body = json.dumps({'host': host, 'key': key, 'keyLocation': f'https://{host}/{key}.txt', 'urlList': batch}).encode()
              req = urllib.request.Request('https://api.indexnow.org/indexnow', data=body, headers={'Content-Type': 'application/json; charset=utf-8'})
              try:
                  with urllib.request.urlopen(req, timeout=60) as r:
                      return r.status, r.read().decode(errors='replace')
              except urllib.error.HTTPError as e:
                  return e.code, e.read().decode(errors='replace')

          for i in range(0, len(urls), 10000):
              batch = urls[i:i + 10000]
              # 403 means the key file could not be verified. Right after a
              # deploy the CDN can still serve a cached 404 for a new file for
              # up to ten minutes, so retry with backoff before giving up.
              for attempt, wait in enumerate([0, 60, 180, 300, 420], start=1):
                  time.sleep(wait)
                  status, text = submit(batch)
                  print(f'Attempt {attempt}: {len(batch)} URLs -> HTTP {status} {text[:200]}')
                  if status in (200, 202):
                      break
                  if status not in (403, 429, 500, 502, 503):
                      raise SystemExit(f'IndexNow rejected the request: HTTP {status}')
              else:
                  raise SystemExit(f'IndexNow still returned HTTP {status} after retries')
          PY
