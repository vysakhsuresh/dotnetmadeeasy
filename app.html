<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes" />
    <title>Modern .NET Developer — Course</title>
    <style>
        /* ============================================================
           ROOT VARIABLES & THEMING
           ============================================================ */
        :root {
            --bg-dark: #0B0E14;
            --bg-panel: #151821;
            --bg-sidebar: #0B0E14;
            --bg-main: #0F121A;
            --bg-card: #1A1E2A;
            --bg-hover: #1E2230;
            --bg-active: rgba(139, 92, 246, 0.12);
            --text-main: #E2E8F0;
            --text-muted: #94A3B8;
            --accent-purple: #8B5CF6;
            --accent-green: #10B981;
            --border-color: #1E293B;
            --shadow-color: rgba(0, 0, 0, 0.6);
            --scrollbar-track: #151821;
            --scrollbar-thumb: #2D3748;
            --card-shadow: 0 8px 32px rgba(0, 0, 0, 0.5);
            --transition-speed: 0.3s;
            --radius: 10px;
            --radius-sm: 6px;
            --font: 'Segoe UI', system-ui, -apple-system, sans-serif;
            --font-size-base: 15px;
            --sidebar-width: 340px;
            --header-height: 60px;
        }

        [data-theme="light"] {
            --bg-dark: #F1F5F9;
            --bg-panel: #FFFFFF;
            --bg-sidebar: #F8FAFC;
            --bg-main: #F1F5F9;
            --bg-card: #FFFFFF;
            --bg-hover: #E2E8F0;
            --bg-active: rgba(139, 92, 246, 0.10);
            --text-main: #0F172A;
            --text-muted: #475569;
            --border-color: #CBD5E1;
            --shadow-color: rgba(0, 0, 0, 0.08);
            --scrollbar-track: #E2E8F0;
            --scrollbar-thumb: #94A3B8;
            --card-shadow: 0 8px 32px rgba(0, 0, 0, 0.08);
        }

        /* ============================================================
           RESET & BASE
           ============================================================ */
        *,
        *::before,
        *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html,
        body {
            height: 100%;
            font-family: var(--font);
            background: var(--bg-dark);
            color: var(--text-main);
            transition: background var(--transition-speed), color var(--transition-speed);
            font-size: var(--font-size-base);
            overflow: hidden;
        }

        ::-webkit-scrollbar {
            width: 4px;
            height: 4px;
        }
        ::-webkit-scrollbar-track {
            background: var(--scrollbar-track);
        }
        ::-webkit-scrollbar-thumb {
            background: var(--scrollbar-thumb);
            border-radius: 10px;
        }

        /* ============================================================
           LAYOUT
           ============================================================ */
        .app {
            display: flex;
            height: 100vh;
            overflow: hidden;
            position: relative;
        }

        /* ─── SIDEBAR ─── */
        .sidebar {
            width: var(--sidebar-width);
            min-width: var(--sidebar-width);
            background: var(--bg-sidebar);
            border-right: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
            height: 100%;
            transition: width 0.3s ease, min-width 0.3s ease, transform 0.3s ease, background var(--transition-speed), border-color var(--transition-speed);
            position: relative;
            z-index: 20;
            overflow: hidden;
            flex-shrink: 0;
        }

        .sidebar.collapsed {
            width: 0;
            min-width: 0;
            border-right: none;
            overflow: hidden;
        }

        .sidebar-overlay {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.4);
            z-index: 15;
            backdrop-filter: blur(2px);
        }
        .sidebar-overlay.active {
            display: block;
        }

        .sidebar-toggle {
            display: none;
            position: fixed;
            top: 12px;
            left: 12px;
            z-index: 30;
            background: var(--bg-panel);
            border: 1px solid var(--border-color);
            color: var(--text-main);
            width: 40px;
            height: 40px;
            border-radius: var(--radius-sm);
            cursor: pointer;
            font-size: 20px;
            transition: all var(--transition-speed);
            box-shadow: var(--card-shadow);
            align-items: center;
            justify-content: center;
        }
        .sidebar-toggle:hover {
            border-color: var(--accent-purple);
            background: var(--bg-hover);
        }

        /* ─── MAIN ─── */
        .main {
            flex: 1;
            background: var(--bg-main);
            overflow-y: auto;
            overflow-x: hidden;
            padding: 0;
            transition: background var(--transition-speed);
            display: flex;
            flex-direction: column;
            height: 100vh;
            -webkit-overflow-scrolling: touch;
        }

        /* ============================================================
           SIDEBAR HEADER
           ============================================================ */
        .sidebar-header {
            padding: 12px 14px 10px;
            border-bottom: 1px solid var(--border-color);
            transition: border-color var(--transition-speed);
            flex-shrink: 0;
        }

        .sidebar-header .top-row {
            display: flex;
            align-items: center;
            gap: 4px;
            margin-bottom: 8px;
            flex-wrap: wrap;
        }

        .sidebar-header .top-row .brand {
            font-size: 14px;
            font-weight: 700;
            color: var(--text-main);
            display: flex;
            align-items: center;
            gap: 4px;
            flex: 1;
            min-width: 100px;
        }

        .sidebar-header .top-row .brand span {
            background: var(--accent-purple);
            color: #fff;
            font-size: 9px;
            font-weight: 600;
            padding: 1px 7px;
            border-radius: 20px;
            letter-spacing: 0.3px;
        }

        .toolbar-btn {
            background: transparent;
            border: 1px solid var(--border-color);
            color: var(--text-muted);
            width: 32px;
            height: 32px;
            border-radius: var(--radius-sm);
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-size: 14px;
            transition: all var(--transition-speed);
            background: var(--bg-panel);
            flex-shrink: 0;
        }
        .toolbar-btn:hover {
            border-color: var(--accent-purple);
            color: var(--text-main);
            background: var(--bg-hover);
        }
        .toolbar-btn.active {
            border-color: var(--accent-purple);
            color: var(--accent-purple);
            background: var(--bg-active);
        }

        .search-wrap {
            position: relative;
        }
        .search-wrap .search-icon {
            position: absolute;
            left: 10px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-muted);
            font-size: 12px;
            pointer-events: none;
        }
        .search-wrap input {
            width: 100%;
            padding: 6px 10px 6px 32px;
            background: var(--bg-panel);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-sm);
            color: var(--text-main);
            font-size: 12px;
            transition: all var(--transition-speed);
            outline: none;
            height: 32px;
        }
        .search-wrap input::placeholder {
            color: var(--text-muted);
            opacity: 0.6;
        }
        .search-wrap input:focus {
            border-color: var(--accent-purple);
            box-shadow: 0 0 0 3px rgba(139, 92, 246, 0.12);
        }
        .search-wrap .clear-btn {
            position: absolute;
            right: 8px;
            top: 50%;
            transform: translateY(-50%);
            background: transparent;
            border: none;
            color: var(--text-muted);
            cursor: pointer;
            font-size: 12px;
            display: none;
            padding: 2px 4px;
        }
        .search-wrap .clear-btn.visible {
            display: block;
        }
        .search-wrap .clear-btn:hover {
            color: var(--text-main);
        }

        .search-info {
            font-size: 10px;
            color: var(--text-muted);
            padding: 3px 0 0 4px;
            min-height: 18px;
            transition: opacity var(--transition-speed);
        }
        .search-info.highlight {
            color: var(--accent-purple);
        }

        /* ============================================================
           TREE CONTAINER
           ============================================================ */
        .tree-container {
            flex: 1;
            overflow-y: auto;
            padding: 8px 10px 16px;
            -webkit-overflow-scrolling: touch;
        }

        .tree-container .course-label {
            font-size: 9px;
            text-transform: uppercase;
            letter-spacing: 0.8px;
            color: var(--text-muted);
            padding: 0 6px 8px 6px;
            font-weight: 600;
        }

        /* ============================================================
           BOOK ACCORDION
           ============================================================ */
        .book-details {
            border-bottom: 1px solid var(--border-color);
            transition: border-color var(--transition-speed);
        }
        .book-details:last-of-type {
            border-bottom: none;
        }

        .book-summary {
            list-style: none;
            cursor: pointer;
            display: block;
            padding: 0;
            transition: background 0.15s;
            border-radius: var(--radius-sm);
        }
        .book-summary::-webkit-details-marker {
            display: none;
        }
        .book-summary:hover {
            background: var(--bg-hover);
        }

        .book-summary .book-header {
            padding: 10px 10px 8px;
            display: flex;
            flex-direction: column;
            gap: 3px;
        }

        .book-summary .book-header .book-title-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-weight: 600;
            font-size: 13px;
            color: var(--text-main);
        }
        .book-summary .book-header .book-title-row .book-icon {
            margin-right: 3px;
        }
        .book-summary .book-header .book-title-row .book-pct {
            font-size: 11px;
            font-weight: 500;
            color: var(--text-muted);
        }
        .book-summary .book-header .book-title-row .book-cert-badge {
            font-size: 13px;
            margin-left: 4px;
        }

        .book-summary .book-header .progress-wrap {
            width: 100%;
            height: 3px;
            background: var(--bg-panel);
            border-radius: 4px;
            overflow: hidden;
            margin: 3px 0 2px;
        }
        .book-summary .book-header .progress-wrap .bar {
            height: 100%;
            background: var(--accent-purple);
            border-radius: 4px;
            transition: width 0.6s ease;
            width: 0%;
        }
        .book-summary .book-header .progress-text {
            font-size: 10px;
            color: var(--text-muted);
        }

        /* ============================================================
           PART ACCORDION
           ============================================================ */
        .part-details {
            margin: 1px 0;
        }
        .part-details summary {
            list-style: none;
            padding: 6px 10px 6px 12px;
            font-size: 12px;
            font-weight: 600;
            color: var(--text-main);
            cursor: pointer;
            border-radius: var(--radius-sm);
            display: flex;
            justify-content: space-between;
            align-items: center;
            transition: background 0.15s;
            user-select: none;
        }
        .part-details summary::-webkit-details-marker {
            display: none;
        }
        .part-details summary:hover {
            background: var(--bg-hover);
        }
        .part-details summary::after {
            content: '▾';
            color: var(--text-muted);
            font-size: 12px;
            transition: transform 0.25s ease;
        }
        .part-details[open] summary::after {
            transform: rotate(180deg);
        }

        /* ============================================================
           LESSON LIST
           ============================================================ */
        .lesson-list {
            list-style: none;
            padding: 2px 0 4px 0;
            margin: 0 0 0 14px;
            border-left: 1.5px solid var(--border-color);
            transition: border-color var(--transition-speed);
        }

        .lesson-list li {
            position: relative;
        }

        .lesson-link {
            display: flex;
            align-items: center;
            gap: 6px;
            text-decoration: none;
            color: var(--text-muted);
            font-size: 12px;
            padding: 5px 10px 5px 14px;
            border-radius: var(--radius-sm);
            transition: all 0.15s;
            cursor: pointer;
            position: relative;
            line-height: 1.3;
        }
        .lesson-link:hover {
            color: var(--text-main);
            background: var(--bg-hover);
        }
        .lesson-link .lesson-status {
            font-size: 10px;
            opacity: 0;
            transition: opacity 0.2s;
            margin-left: auto;
            display: flex;
            gap: 3px;
            align-items: center;
            flex-shrink: 0;
        }
        .lesson-link .lesson-status.done {
            opacity: 1;
            color: var(--accent-green);
        }

        .lesson-link.active {
            color: var(--accent-purple);
            background: var(--bg-active);
            font-weight: 500;
        }
        .lesson-link.active::before {
            content: '';
            position: absolute;
            left: -1.5px;
            top: 4px;
            bottom: 4px;
            width: 2.5px;
            background: var(--accent-purple);
            border-radius: 0 4px 4px 0;
        }

        .lesson-link.completed {
            color: var(--text-muted);
        }
        .lesson-link.completed .check-mark {
            color: var(--accent-green);
        }

        .lesson-link .match-highlight {
            background: rgba(139, 92, 246, 0.25);
            padding: 0 2px;
            border-radius: 2px;
            font-weight: 600;
        }
        [data-theme="light"] .lesson-link .match-highlight {
            background: rgba(139, 92, 246, 0.20);
        }

        .lesson-link.hidden {
            display: none;
        }
        .part-details.hidden-part>summary,
        .part-details.hidden-part>.lesson-list {
            display: none;
        }
        .book-details.hidden-book>.book-summary,
        .book-details.hidden-book>.nav-tree {
            display: none;
        }

        /* ============================================================
           MAIN CONTENT AREA
           ============================================================ */
        .main-content {
            flex: 1;
            padding: 20px 24px 40px;
            max-width: 880px;
            margin: 0 auto;
            width: 100%;
            animation: fadeSlideIn 0.35s ease;
            -webkit-overflow-scrolling: touch;
        }

        @keyframes fadeSlideIn {
            from {
                opacity: 0;
                transform: translateY(12px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .main-content .breadcrumb {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 11px;
            color: var(--text-muted);
            margin-bottom: 14px;
            flex-wrap: wrap;
        }
        .main-content .breadcrumb span {
            color: var(--text-muted);
        }
        .main-content .breadcrumb .sep {
            opacity: 0.4;
        }
        .main-content .breadcrumb .crumb-link {
            color: var(--text-muted);
            text-decoration: none;
            cursor: pointer;
            transition: color 0.15s;
        }
        .main-content .breadcrumb .crumb-link:hover {
            color: var(--accent-purple);
        }
        .main-content .breadcrumb .current {
            color: var(--text-main);
            font-weight: 500;
        }

        .main-content .lesson-header {
            margin-bottom: 18px;
        }
        .main-content .lesson-header .lesson-number {
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            color: var(--accent-purple);
            font-weight: 600;
        }
        .main-content .lesson-header h1 {
            font-size: 24px;
            font-weight: 700;
            color: var(--text-main);
            margin: 4px 0 4px;
            line-height: 1.25;
            word-break: break-word;
        }
        .main-content .lesson-header .lesson-meta {
            display: flex;
            align-items: center;
            gap: 12px;
            font-size: 12px;
            color: var(--text-muted);
            flex-wrap: wrap;
        }
        .main-content .lesson-header .lesson-meta .part-tag {
            background: var(--bg-panel);
            padding: 2px 10px;
            border-radius: 20px;
            border: 1px solid var(--border-color);
            font-size: 10px;
        }

        .lesson-body {
            color: var(--text-main);
            font-size: 15px;
            line-height: 1.75;
            transition: font-size 0.2s;
            overflow-wrap: break-word;
            word-wrap: break-word;
        }
        .lesson-body p {
            margin-bottom: 14px;
        }
        .lesson-body h2 {
            font-size: 20px;
            font-weight: 600;
            margin: 24px 0 10px;
            color: var(--text-main);
        }
        .lesson-body h3 {
            font-size: 17px;
            font-weight: 600;
            margin: 18px 0 8px;
            color: var(--text-main);
        }
        .lesson-body h4 {
            font-size: 15px;
            font-weight: 600;
            margin: 14px 0 6px;
            color: var(--text-main);
        }
        .lesson-body ul,
        .lesson-body ol {
            margin: 0 0 14px 20px;
        }
        .lesson-body li {
            margin-bottom: 5px;
        }
        .lesson-body code {
            background: var(--bg-panel);
            padding: 2px 7px;
            border-radius: 4px;
            font-size: 13px;
            font-family: 'JetBrains Mono', 'Cascadia Code', 'Consolas', monospace;
            color: var(--accent-purple);
            border: 1px solid var(--border-color);
            white-space: nowrap;
        }
        .lesson-body pre {
            background: var(--bg-panel);
            padding: 14px 16px;
            border-radius: var(--radius-sm);
            overflow-x: auto;
            border: 1px solid var(--border-color);
            margin: 14px 0;
            font-size: 13px;
            font-family: 'JetBrains Mono', 'Cascadia Code', 'Consolas', monospace;
            line-height: 1.6;
            color: var(--text-main);
            -webkit-overflow-scrolling: touch;
        }
        .lesson-body pre code {
            background: transparent;
            border: none;
            color: inherit;
            padding: 0;
            font-size: 13px;
            white-space: pre-wrap;
            word-break: break-word;
        }
        .lesson-body .tip-box {
            background: var(--bg-active);
            border-left: 3px solid var(--accent-purple);
            padding: 12px 16px;
            border-radius: var(--radius-sm);
            margin: 14px 0;
            color: var(--text-main);
        }
        .lesson-body .tip-box strong {
            color: var(--accent-purple);
        }
        .lesson-body .concept-box {
            background: var(--bg-panel);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-sm);
            padding: 14px 18px;
            margin: 14px 0;
        }
        .lesson-body .concept-box .concept-title {
            font-weight: 600;
            color: var(--accent-blue);
            font-size: 14px;
            margin-bottom: 6px;
        }
        .lesson-body .concept-box .concept-title .emoji {
            margin-right: 6px;
        }
        .lesson-body .example-box {
            background: var(--bg-panel);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-sm);
            padding: 12px 16px;
            margin: 12px 0;
            border-left: 3px solid var(--accent-orange);
        }
        .lesson-body .example-box .example-label {
            font-weight: 600;
            color: var(--accent-orange);
            font-size: 12px;
            margin-bottom: 4px;
        }
        .lesson-body .highlight-green {
            color: var(--accent-green);
            font-weight: 500;
        }
        .lesson-body .highlight-purple {
            color: var(--accent-purple);
            font-weight: 500;
        }

        /* ============================================================
           LESSON NAVIGATION
           ============================================================ */
        .lesson-nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 28px;
            padding-top: 16px;
            border-top: 1px solid var(--border-color);
            gap: 10px;
            flex-wrap: wrap;
        }
        .lesson-nav .nav-btn {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            padding: 6px 14px;
            border-radius: var(--radius-sm);
            border: 1px solid var(--border-color);
            background: var(--bg-panel);
            color: var(--text-main);
            cursor: pointer;
            font-size: 12px;
            transition: all 0.15s;
            text-decoration: none;
            height: 36px;
        }
        .lesson-nav .nav-btn:hover {
            border-color: var(--accent-purple);
            background: var(--bg-hover);
        }
        .lesson-nav .nav-btn:disabled {
            opacity: 0.3;
            cursor: not-allowed;
            pointer-events: none;
        }
        .lesson-nav .complete-toggle {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 6px 14px;
            border-radius: var(--radius-sm);
            border: 1px solid var(--border-color);
            background: var(--bg-panel);
            color: var(--text-muted);
            cursor: pointer;
            font-size: 12px;
            transition: all 0.15s;
            height: 36px;
        }
        .lesson-nav .complete-toggle:hover {
            border-color: var(--accent-green);
            color: var(--text-main);
        }
        .lesson-nav .complete-toggle.done {
            border-color: var(--accent-green);
            color: var(--accent-green);
            background: rgba(16, 185, 129, 0.08);
        }

        /* ============================================================
           EMPTY STATE
           ============================================================ */
        .empty-state {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100%;
            text-align: center;
            color: var(--text-muted);
            padding: 40px 20px;
        }
        .empty-state .icon {
            font-size: 48px;
            margin-bottom: 14px;
            opacity: 0.5;
        }
        .empty-state h2 {
            color: var(--text-main);
            font-size: 20px;
            margin-bottom: 6px;
        }
        .empty-state p {
            max-width: 400px;
            font-size: 14px;
        }

        /* ============================================================
           RESPONSIVE
           ============================================================ */

        /* Tablets and small desktops */
        @media (max-width: 900px) {
            :root {
                --sidebar-width: 300px;
            }
            .main-content {
                padding: 16px 20px 30px;
            }
            .main-content .lesson-header h1 {
                font-size: 22px;
            }
        }

        /* Mobile landscape & tablets */
        @media (max-width: 768px) {
            :root {
                --sidebar-width: 280px;
            }

            .sidebar {
                position: fixed;
                top: 0;
                left: 0;
                height: 100vh;
                z-index: 20;
                transform: translateX(-100%);
                width: var(--sidebar-width);
                min-width: var(--sidebar-width);
                border-right: 1px solid var(--border-color);
                box-shadow: var(--card-shadow);
                transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            }
            .sidebar.open {
                transform: translateX(0);
            }
            .sidebar.collapsed {
                transform: translateX(-100%);
                width: var(--sidebar-width);
                min-width: var(--sidebar-width);
            }

            .sidebar-overlay.active {
                display: block;
            }

            .sidebar-toggle {
                display: flex;
            }

            .main {
                height: 100vh;
                padding-top: 0;
            }

            // ─── STATE ──────────────────────────────────────────────────────

            // ─── HELPERS ──────────────────────────────────────────────────
            function getBookTitle(bookId) {
                for (const b of COURSE_DATA.books) {
                    if (b.id === bookId) return b.title;
                }
                return bookId;
            }

            function getPartTitle(bookId, partId) {
                for (const b of COURSE_DATA.books) {
                    if (b.id === bookId) {
                        for (const p of b.parts) {
                            if (p.id === partId) return p.title;
                        }
                    }
                }
                return partId;
            }

            function getLessonIndex(id) {
                return state.flatLessons.findIndex(l => l.lesson.id === id);
            }

            function getPrevLessonId(id) {
                const idx = getLessonIndex(id);
                if (idx > 0) return state.flatLessons[idx - 1].lesson.id;
                return null;
            }

            function getNextLessonId(id) {
                const idx = getLessonIndex(id);
                if (idx < state.flatLessons.length - 1) return state.flatLessons[idx + 1].lesson.id;
                return null;
            }

            function countLessonsInBook(bookId) {
                const book = COURSE_DATA.books.find(b => b.id === bookId);
                if (!book) return 0;
                let count = 0;
                for (const p of book.parts) count += p.lessons.length;
                return count;
            }

            function countCompletedInBook(bookId) {
                let count = 0;
                for (const id of state.completed) {
                    const entry = state.lessonMap[id];
                    if (entry && entry.book === bookId) count++;
                }
                return count;
            }

            function countCompletedInPart(bookId, partId) {
                let count = 0;
                for (const id of state.completed) {
                    const entry = state.lessonMap[id];
                    if (entry && entry.book === bookId && entry.part === partId) count++;
                }
                return count;
            }

            function isBookComplete(bookId) {
                return countCompletedInBook(bookId) === countLessonsInBook(bookId) && countLessonsInBook(bookId) > 0;
            }

            function getTotalCompleted() { return state.completed.size; }

            function getTotalLessons() { return state.flatLessons.length; }

            // ─── SAVE / LOAD STATE ──────────────────────────────────────────
            function saveCompleted() {
                try { localStorage.setItem('dotnet_completed', JSON.stringify([...state.completed])); } catch (_) {}
            }
            function loadCompleted() {
                try { const data = localStorage.getItem('dotnet_completed'); if (data) state.completed = new Set(JSON
                        .parse(data)); } catch (_) {}
            }

            // ─── FILENAME GENERATION ──────────────────────────────────────
            function getLessonFilename(lessonId, lessonTitle) {
                // 1. Check the custom map first
                if (FILE_MAP[lessonId]) {
                    return FILE_MAP[lessonId];
                }

                // 2. Fallback: generate a name from the title (no numeric prefix)
                let slug = lessonTitle.toLowerCase()
                    .replace(/[^a-z0-9\s-]/g, '')
                    .replace(/\s+/g, '-')
                    .replace(/-+/g, '-');
                slug = slug.replace(/^-|-$/g, '');
                return `${slug}.html`;
            }

            // ─── FETCH CONTENT ──────────────────────────────────────────────
			async function fetchLessonContent(lessonId, lessonTitle) {
				const filename = getLessonFilename(lessonId, lessonTitle);
				const paths = [
					`Content/${filename}`,
					`./Content/${filename}`,
					`../Content/${filename}`  // fallback if the app is in a subfolder
				];
				
				for (const url of paths) {
					try {
						console.log(`Trying to load: ${url}`);
						const response = await fetch(url);
						if (response.ok) {
							const html = await response.text();
							return html;
						}
					} catch (err) {
						console.warn(`Failed to load ${url}:`, err);
					}
				}
				
				// If all fail, show a helpful error with the first path
				const firstPath = paths[0];
				return `<p style="color:var(--text-muted);">❌ Content not found. Tried these paths:<br>${paths.join('<br>')}<br><br>Make sure the file <strong>${filename}</strong> exists in the <strong>Content</strong> folder.</p>`;
			}

            // ─── RENDER TREE ──────────────────────────────────────────────
            function renderTree() {
                let html = '';
                for (const book of COURSE_DATA.books) {
                    const completedInBook = countCompletedInBook(book.id);
                    const totalInBook = countLessonsInBook(book.id);
                    const pct = totalInBook ? Math.round((completedInBook / totalInBook) * 100) : 0;
                    const complete = isBookComplete(book.id);

                    html += `<details class="book-details" data-book="${book.id}" open>`;
                    html += `<summary class="book-summary">`;
                    html += `<div class="book-header">`;
                    html += `<div class="book-title-row">`;
                    html += `<span><span class="book-icon">${book.icon}</span> ${book.title}</span>`;
                    html += `<span>`;
                    if (complete) html += `<span class="book-cert-badge">🎓</span> `;
                    html += `<span class="book-pct">${pct}%</span>`;
                    html += `</span>`;
                    html += `</div>`;
                    html += `<div class="progress-wrap"><div class="bar" style="width:${pct}%"></div></div>`;
                    html += `<div class="progress-text">${completedInBook} / ${totalInBook} Lessons Completed</div>`;
                    html += `</div>`;
                    html += `</summary>`;
                    html += `<div class="nav-tree" style="padding:0 0 6px 0;">`;

                    for (const part of book.parts) {
                        const completedInPart = countCompletedInPart(book.id, part.id);
                        const totalInPart = part.lessons.length;
                        const partPct = totalInPart ? Math.round((completedInPart / totalInPart) * 100) : 0;
                        const openAttr = (partPct < 100) ? 'open' : '';

                        html += `<details class="part-details" data-book="${book.id}" data-part="${part.id}" ${openAttr}>`;
                        html += `<summary>`;
                        html += `<span>${part.title}</span>`;
                        html += `<span style="font-weight:400;font-size:10px;color:var(--text-muted);">${partPct}%</span>`;
                        html += `</summary>`;
                        html += `<ul class="lesson-list">`;

                        for (const lesson of part.lessons) {
                            const isActive = (state.currentId === lesson.id);
                            const isCompleted = state.completed.has(lesson.id);
                            const cls = isActive ? 'active' : '';
                            const doneCls = isCompleted ? 'completed' : '';

                            let displayTitle = lesson.title;
                            if (state.searchQuery) {
                                const idx = lesson.title.toLowerCase().indexOf(state.searchQuery.toLowerCase());
                                if (idx !== -1) {
                                    const before = lesson.title.slice(0, idx);
                                    const match = lesson.title.slice(idx, idx + state.searchQuery.length);
                                    const after = lesson.title.slice(idx + state.searchQuery.length);
                                    displayTitle = `${before}<span class="match-highlight">${match}</span>${after}`;
                                }
                            }

                            html += `<li>`;
                            html += `<a class="lesson-link ${cls} ${doneCls}" data-id="${lesson.id}" href="#">`;
                            html += `<span>${displayTitle}</span>`;
                            html += `<span class="lesson-status ${isCompleted ? 'done' : ''}">`;
                            if (isCompleted) html += ` ✅`;
                            html += `</span>`;
                            html += `</a>`;
                            html += `</li>`;
                        }

                        html += `</ul>`;
                        html += `</details>`;
                    }

                    html += `</div>`;
                    html += `</details>`;
                }
                treeRoot.innerHTML = html;

                treeRoot.querySelectorAll('.lesson-link').forEach(el => {
                    el.addEventListener('click', (e) => {
                        e.preventDefault();
                        const id = el.dataset.id;
                        if (id) loadLesson(id);
                        if (window.innerWidth <= 768) closeSidebar();
                    });
                });

                applySearchFilter();
                updateProgressBars();
            }

            // ─── UPDATE PROGRESS BARS ──────────────────────────────────
            function updateProgressBars() {
                for (const book of COURSE_DATA.books) {
                    const details = treeRoot.querySelector(`.book-details[data-book="${book.id}"]`);
                    if (!details) continue;
                    const bar = details.querySelector('.progress-wrap .bar');
                    const pctText = details.querySelector('.book-pct');
                    const progressText = details.querySelector('.progress-text');
                    const completed = countCompletedInBook(book.id);
                    const total = countLessonsInBook(book.id);
                    const pct = total ? Math.round((completed / total) * 100) : 0;
                    if (bar) bar.style.width = pct + '%';
                    if (pctText) {
                        const complete = isBookComplete(book.id);
                        pctText.textContent = (complete ? '🎓 ' : '') + pct + '%';
                    }
                    if (progressText) progressText.textContent = `${completed} / ${total} Lessons Completed`;

                    const certBadge = details.querySelector('.book-cert-badge');
                    if (isBookComplete(book.id)) {
                        if (!certBadge) {
                            const row = details.querySelector('.book-title-row');
                            if (row) {
                                const span = row.querySelector('span:last-child');
                                if (span) {
                                    const badge = document.createElement('span');
                                    badge.className = 'book-cert-badge';
                                    badge.textContent = '🎓';
                                    span.prepend(badge);
                                }
                            }
                        }
                    } else {
                        if (certBadge) certBadge.remove();
                    }

                    for (const part of book.parts) {
                        const partDetails = details.querySelector(`.part-details[data-part="${part.id}"]`);
                        if (!partDetails) continue;
                        const sum = partDetails.querySelector('summary');
                        const completedInPart = countCompletedInPart(book.id, part.id);
                        const totalInPart = part.lessons.length;
                        const pctPart = totalInPart ? Math.round((completedInPart / totalInPart) * 100) : 0;
                        if (sum) {
                            const pctSpan = sum.querySelector('span:last-child');
                            if (pctSpan) pctSpan.textContent = pctPart + '%';
                        }
                    }
                }

                treeRoot.querySelectorAll('.lesson-link').forEach(el => {
                    const id = el.dataset.id;
                    const isCompleted = state.completed.has(id);
                    const statusEl = el.querySelector('.lesson-status');
                    if (statusEl) {
                        statusEl.innerHTML = isCompleted ? ' ✅' : '';
                        statusEl.classList.toggle('done', isCompleted);
                    }
                    el.classList.toggle('completed', isCompleted);
                });
            }

            // ─── SIDEBAR TOGGLE (mobile) ──────────────────────────────────
            function openSidebar() {
                sidebar.classList.add('open');
                sidebarOverlay.classList.add('active');
                state.sidebarOpen = true;
            }

            function closeSidebar() {
                sidebar.classList.remove('open');
                sidebarOverlay.classList.remove('active');
                state.sidebarOpen = false;
            }

            function toggleSidebar() {
                if (state.sidebarOpen) closeSidebar();
                else openSidebar();
            }

            // ─── LOAD LESSON ──────────────────────────────────────────────
            async function loadLesson(id) {
                const entry = state.lessonMap[id];
                if (!entry) return;

                state.currentId = id;

                treeRoot.querySelectorAll('.lesson-link').forEach(el => {
                    el.classList.toggle('active', el.dataset.id === id);
                });

                const activeEl = treeRoot.querySelector(`.lesson-link.active`);
                if (activeEl) activeEl.scrollIntoView({ block: 'center', behavior: 'smooth' });

                const bookTitle = getBookTitle(entry.book);
                const partTitle = getPartTitle(entry.book, entry.part);
                breadcrumb.innerHTML = `
              <span class="crumb-link" data-book="${entry.book}">${bookTitle}</span>
              <span class="sep">›</span>
              <span class="crumb-link" data-book="${entry.book}" data-part="${entry.part}">${partTitle}</span>
              <span class="sep">›</span>
              <span class="current">${entry.lesson.title}</span>
            `;
                breadcrumb.querySelectorAll('.crumb-link').forEach(el => {
                    el.addEventListener('click', () => {
                        const book = el.dataset.book;
                        const part = el.dataset.part;
                        if (part) {
                            const details = treeRoot.querySelector(
                                `.part-details[data-book="${book}"][data-part="${part}"]`);
                            if (details) details.open = true;
                        }
                        const bookDetails = treeRoot.querySelector(`.book-details[data-book="${book}"]`);
                        if (bookDetails) bookDetails.open = true;
                        if (window.innerWidth <= 768) closeSidebar();
                    });
                });

                const total = state.flatLessons.length;
                const idx = getLessonIndex(id);
                lessonNumber.textContent = `Lesson ${idx + 1} of ${total}`;
                lessonTitle.textContent = entry.lesson.title;
                lessonBook.textContent = `📚 ${bookTitle}`;
                lessonPart.textContent = partTitle;

                const isCompleted = state.completed.has(id);
                lessonStatus.textContent = isCompleted ? '✅ Completed' : '📝 In Progress';
                lessonStatus.style.color = isCompleted ? 'var(--accent-green)' : 'var(--text-muted)';

                // Load content from external file
                const contentHtml = await fetchLessonContent(id, entry.lesson.title);
                lessonBody.innerHTML = contentHtml;

                completeToggle.textContent = isCompleted ? '✅ Completed' : '☐ Mark Complete';
                completeToggle.classList.toggle('done', isCompleted);

                const prevId = getPrevLessonId(id);
                const nextId = getNextLessonId(id);
                prevBtn.disabled = !prevId;
                nextBtn.disabled = !nextId;
                prevBtn.onclick = () => { if (prevId) loadLesson(prevId); };
                nextBtn.onclick = () => { if (nextId) loadLesson(nextId); };

                emptyState.style.display = 'none';
                lessonView.style.display = 'block';

                try { localStorage.setItem('dotnet_lastLesson', id); } catch (_) {}

                if (history.pushState) history.pushState({ lessonId: id }, '', `#${id}`);

                checkBookCompletion(entry.book);
            }

            // ─── BOOK COMPLETION CHECK ──────────────────────────────────
            function checkBookCompletion(bookId) {
                if (isBookComplete(bookId)) {
                    updateProgressBars();
                }
            }

            // ─── TOGGLE COMPLETE ──────────────────────────────────────────
            function toggleComplete() {
                if (!state.currentId) return;
                const id = state.currentId;
                if (state.completed.has(id)) state.completed.delete(id);
                else state.completed.add(id);
                saveCompleted();
                updateProgressBars();
                const entry = state.lessonMap[id];
                if (entry) {
                    const isCompleted = state.completed.has(id);
                    lessonStatus.textContent = isCompleted ? '✅ Completed' : '📝 In Progress';
                    lessonStatus.style.color = isCompleted ? 'var(--accent-green)' : 'var(--text-muted)';
                    completeToggle.textContent = isCompleted ? '✅ Completed' : '☐ Mark Complete';
                    completeToggle.classList.toggle('done', isCompleted);
                    checkBookCompletion(entry.book);
                }
            }

            // ─── SEARCH ──────────────────────────────────────────────────
            function applySearchFilter() {
                const query = state.searchQuery.trim().toLowerCase();
                const links = treeRoot.querySelectorAll('.lesson-link');
                let visibleCount = 0;
                links.forEach(link => {
                    const title = link.textContent.trim().toLowerCase();
                    const match = !query || title.includes(query);
                    link.classList.toggle('hidden', !match);
                    if (match) visibleCount++;
                });
                treeRoot.querySelectorAll('.part-details').forEach(details => {
                    const visibleLinks = details.querySelectorAll('.lesson-link:not(.hidden)');
                    details.classList.toggle('hidden-part', visibleLinks.length === 0);
                });
                treeRoot.querySelectorAll('.book-details').forEach(details => {
                    const visibleParts = details.querySelectorAll('.part-details:not(.hidden-part)');
                    details.classList.toggle('hidden-book', visibleParts.length === 0);
                });
                if (query) {
                    searchInfo.textContent = `Showing ${visibleCount} of ${links.length} lessons`;
                    searchInfo.classList.add('highlight');
                } else {
                    searchInfo.textContent = '';
                    searchInfo.classList.remove('highlight');
                }
                clearSearch.classList.toggle('visible', query.length > 0);
            }

            // ─── THEME ────────────────────────────────────────────────────
            function setTheme(theme) {
                state.theme = theme;
                document.documentElement.setAttribute('data-theme', theme);
                themeToggle.textContent = theme === 'dark' ? '🌓' : '☀️';
                try { localStorage.setItem('dotnet_theme', theme); } catch (_) {}
            }
            function toggleTheme() { setTheme(state.theme === 'dark' ? 'light' : 'dark'); }

            // ─── EXPAND / COLLAPSE ──────────────────────────────────
            function expandAll() { treeRoot.querySelectorAll('.book-details, .part-details').forEach(el => { el.open =
                        true; }); }

            function collapseAll() {
                treeRoot.querySelectorAll('.book-details, .part-details').forEach(el => { el.open = false; });
                if (state.currentId) {
                    const entry = state.lessonMap[state.currentId];
                    if (entry) {
                        const bookDetails = treeRoot.querySelector(`.book-details[data-book="${entry.book}"]`);
                        if (bookDetails) bookDetails.open = true;
                        const partDetails = treeRoot.querySelector(
                            `.part-details[data-book="${entry.book}"][data-part="${entry.part}"]`);
                        if (partDetails) partDetails.open = true;
                    }
                }
            }

            // ─── BUILD LESSON MAP ────────────────────────────────────────
            function buildLessonMap() {
                state.lessonMap = {};
                state.flatLessons = [];
                for (const book of COURSE_DATA.books) {
                    for (const part of book.parts) {
                        for (const lesson of part.lessons) {
                            state.lessonMap[lesson.id] = { book: book.id, part: part.id, lesson: lesson };
                            state.flatLessons.push({ book: book.id, part: part.id, lesson: lesson });
                        }
                    }
                }
            }

            // ─── ROUTING ──────────────────────────────────────────────────
            function routeFromHash() {
                const hash = window.location.hash.slice(1);
                if (hash && state.lessonMap[hash]) { loadLesson(hash); return true; }
                return false;
            }

            // ─── INIT ──────────────────────────────────────────────────────
            function init() {
                let savedTheme = 'dark';
                try { savedTheme = localStorage.getItem('dotnet_theme') || 'dark'; } catch (_) {}
                setTheme(savedTheme);

                loadCompleted();
                buildLessonMap();
                renderTree();

                let restored = routeFromHash();
                if (!restored) {
                    let lastId = null;
                    try { lastId = localStorage.getItem('dotnet_lastLesson'); } catch (_) {}
                    if (lastId && state.lessonMap[lastId]) { loadLesson(lastId);
                        restored = true; }
                }
                if (!restored && state.flatLessons.length > 0) {
                    loadLesson(state.flatLessons[0].lesson.id);
                }

                // ─── EVENTS ─────────────────────────────────────────────
                sidebarToggle.addEventListener('click', toggleSidebar);
                sidebarOverlay.addEventListener('click', closeSidebar);

                let resizeTimeout;
                window.addEventListener('resize', () => {
                    clearTimeout(resizeTimeout);
                    resizeTimeout = setTimeout(() => {
                        if (window.innerWidth > 768 && state.sidebarOpen) closeSidebar();
                    }, 200);
                });

                searchInput.addEventListener('input', () => { state.searchQuery = searchInput.value;
                    applySearchFilter(); });
                clearSearch.addEventListener('click', () => { searchInput.value = '';
                    state.searchQuery = '';
                    applySearchFilter();
                    searchInput.focus(); });
                themeToggle.addEventListener('click', toggleTheme);
                expandAllBtn.addEventListener('click', expandAll);
                collapseAllBtn.addEventListener('click', collapseAll);
                completeToggle.addEventListener('click', toggleComplete);

                window.addEventListener('hashchange', () => {
                    const hash = window.location.hash.slice(1);
                    if (hash && state.lessonMap[hash]) loadLesson(hash);
                });

                window.addEventListener('popstate', (e) => { if (e.state && e.state.lessonId) loadLesson(e.state
                        .lessonId); });

                console.log(`🚀 Modern .NET Developer (v6) — ${state.flatLessons.length} lessons loaded`);
                console.log(`📊 Progress: ${getTotalCompleted()}/${getTotalLessons()} completed`);
                console.log(`📁 Lesson content loaded from the 'Content' folder using FILE_MAP.`);
            }

            if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', init);
            else init();

        })();
    </script>

</body>
</html>
