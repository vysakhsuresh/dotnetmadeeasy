<!DOCTYPE html>
<html>
<head>
  <style>
    body {
      background: #0B0E14;
      color: #E2E8F0;
      margin: 0 auto;
      padding: 2rem;
      max-width: 1000px;
      width: 100%;
      box-sizing: border-box;
      font-family: system-ui;
    }
    .box { background: #151821; padding: 1rem; margin: 1rem 0; }
  </style>
</head>
<body>
  <div class="box">This should be full width up to 1000px.</div>
  <div class="box">If it's not, then your viewport or browser zoom might be narrow.</div>
</body>
</html>
